<line x1="989.0" y1="180" x2="989.0" y2="200" stroke="#8FA3B4" stroke-width="1.8" marker-end="url(#arw)"/>
<line x1="1180" y1="204" x2="1180" y2="264" stroke="#11567F" stroke-width="2.4"/>
<text x="1194" y="224.0" font-size="11" font-weight="700" fill="#11567F">Features computed as of the</text>
<text x="1194" y="238.0" font-size="11" font-weight="700" fill="#11567F">alert date, not as of today.</text>
<text x="1194" y="252.0" font-size="11" font-weight="700" fill="#11567F">This is what stops leakage.</text>
