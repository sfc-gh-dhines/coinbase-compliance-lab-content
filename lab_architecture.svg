<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B4"/></marker></defs>
<rect width="1400" height="850" fill="#FFFFFF"/>
<text x="64" y="40" font-size="24" font-weight="700" fill="#0B3D5C">Compliance Lab: the ML lifecycle, end to end, in two hours</text>
<text x="64" y="63" font-size="13" fill="#5A6B7B">Every box below is created live from a Cortex Code prompt. Synthetic data, standalone Snowflake account, one schema per attendee.</text>
<circle cx="26" cy="107" r="11" fill="#11567F"/>
<text x="26" y="111" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
<text x="30" y="148.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#11567F" letter-spacing="0.8" transform="rotate(-90 30 148.0)">DATA</text>
<rect x="64" y="96" width="200" height="64" rx="8" fill="#F2F7FB" stroke="#D3E2EE" stroke-width="1.6"/>
<text x="164.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2733">DIM_ACCOUNT_PROFILE</text>
<text x="164.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">KYC, jurisdiction,</text>
<text x="164.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">declared volume</text>
<rect x="289" y="96" width="200" height="64" rx="8" fill="#F2F7FB" stroke="#D3E2EE" stroke-width="1.6"/>
<text x="389.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2733">FACT_MONITORED_TXN</text>
<text x="389.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">transaction history,</text>
<text x="389.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">counterparties</text>
<rect x="514" y="96" width="200" height="64" rx="8" fill="#F2F7FB" stroke="#D3E2EE" stroke-width="1.6"/>
<text x="614.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2733">DIM_AML_RULE</text>
<text x="614.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">the rules engine</text>
<text x="614.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">in production today</text>
<rect x="739" y="96" width="200" height="64" rx="8" fill="#F2F7FB" stroke="#D3E2EE" stroke-width="1.6"/>
<text x="839.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2733">FACT_AML_ALERT</text>
<text x="839.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">labelled dispositions,</text>
<text x="839.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">the training labels</text>
<rect x="964" y="96" width="200" height="64" rx="8" fill="#F2F7FB" stroke="#D3E2EE" stroke-width="1.6"/>
<text x="1064.0" y="116.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2733">CASE_NOTES</text>
<text x="1064.0" y="133.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">investigator writeups,</text>
<text x="1064.0" y="148.0" text-anchor="middle" font-size="10.5" fill="#5A6B7B">prior SAR narratives</text>
<line x1="1180" y1="100" x2="1180" y2="156" stroke="#C0392B" stroke-width="2.4"/>
<text x="1194" y="111.0" font-size="11" font-weight="700" fill="#C0392B">Pre-loaded before the lab.</text>
<text x="1194" y="125.0" font-size="11" font-weight="700" fill="#C0392B">Imbalanced classes, noisy labels,</text>
<text x="1194" y="139.0" font-size="11" font-weight="700" fill="#C0392B">and two typologies the rules</text>
<text x="1194" y="153.0" font-size="11" font-weight="700" fill="#C0392B">cannot see by construction.</text>
<circle cx="26" cy="211" r="11" fill="#11567F"/>
<text x="26" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
<text x="30" y="254.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#11567F" letter-spacing="0.8" transform="rotate(-90 30 254.0)">FEATURES</text>
<rect x="64" y="200" width="350" height="68" rx="8" fill="#EAF6FD" stroke="#B9DFF3" stroke-width="1.6"/>
<text x="239.0" y="222.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">FEATURE STORE</text>
<text x="239.0" y="239.0" text-anchor="middle" font-size="11" fill="#5A6B7B">entity on CUSTOMER_ID</text>
<text x="239.0" y="254.0" text-anchor="middle" font-size="11" fill="#5A6B7B">registered once, reused everywhere</text>
<rect x="439" y="200" width="350" height="68" rx="8" fill="#EAF6FD" stroke="#B9DFF3" stroke-width="1.6"/>
<text x="614.0" y="222.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">BEHAVIOURAL FEATURE VIEW</text>
<text x="614.0" y="239.0" text-anchor="middle" font-size="11" fill="#5A6B7B">structuring, layering, mule-ring</text>
<text x="614.0" y="254.0" text-anchor="middle" font-size="11" fill="#5A6B7B">and wash-trading signals</text>
<rect x="814" y="200" width="350" height="68" rx="8" fill="#EAF6FD" stroke="#B9DFF3" stroke-width="1.6"/>
<text x="989.0" y="222.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">TRAINING SPINE</text>
<text x="989.0" y="239.0" text-anchor="middle" font-size="11" fill="#5A6B7B">one row per alert, keyed on</text>
<text x="989.0" y="254.0" text-anchor="middle" font-size="11" fill="#5A6B7B">(CUSTOMER_ID, ALERT_DATE)</text>
<line x1="164.0" y1="160" x2="164.0" y2="180" stroke="#8FA3B4" stroke-width="1.8"/>
<line x1="389.0" y1="160" x2="389.0" y2="180" stroke="#8FA3B4" stroke-width="1.8"/>
