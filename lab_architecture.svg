<text x="1194" y="330.0" font-size="11" font-weight="700" fill="#11567F">No cluster provisioned.</text>
<text x="1194" y="344.0" font-size="11" font-weight="700" fill="#11567F">No environment configured.</text>
<text x="1194" y="358.0" font-size="11" font-weight="700" fill="#11567F">Data never leaves Snowflake.</text>
