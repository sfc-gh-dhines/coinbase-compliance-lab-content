<text x="26" y="323" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
<text x="30" y="360.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#11567F" letter-spacing="0.8" transform="rotate(-90 30 360.0)">TRAIN</text>
<rect x="64" y="308" width="350" height="64" rx="8" fill="#E3F2FC" stroke="#9CD3EE" stroke-width="1.6"/>
<text x="239.0" y="337.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">ML JOB on COMPLIANCE_LAB_POOL</text>
<text x="239.0" y="355.0" text-anchor="middle" font-size="11" fill="#5A6B7B">XGBoost, container runtime</text>
<rect x="439" y="308" width="350" height="64" rx="8" fill="#E3F2FC" stroke="#9CD3EE" stroke-width="1.6"/>
<text x="614.0" y="337.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">HYPERPARAMETER SWEEP</text>
<text x="614.0" y="355.0" text-anchor="middle" font-size="11" fill="#5A6B7B">8 to 12 trials</text>
<rect x="814" y="308" width="350" height="64" rx="8" fill="#E3F2FC" stroke="#9CD3EE" stroke-width="1.6"/>
<text x="989.0" y="337.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">MODEL REGISTRY</text>
<text x="989.0" y="355.0" text-anchor="middle" font-size="11" fill="#5A6B7B">versioned, with metrics and lineage</text>
<line x1="239.0" y1="268" x2="239.0" y2="308" stroke="#8FA3B4" stroke-width="1.8" marker-end="url(#arw)"/>
