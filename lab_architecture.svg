<rect x="64" y="412" width="350" height="64" rx="8" fill="#EAF6FD" stroke="#B9DFF3" stroke-width="1.6"/>
<text x="239.0" y="441.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">BATCH INFERENCE</text>
<text x="239.0" y="459.0" text-anchor="middle" font-size="11" fill="#5A6B7B">scored alert queue, ranked by risk</text>
<rect x="439" y="412" width="350" height="64" rx="8" fill="#EAF6FD" stroke="#B9DFF3" stroke-width="1.6"/>
<text x="614.0" y="441.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">SHAP EXPLANATIONS</text>
<text x="614.0" y="459.0" text-anchor="middle" font-size="11" fill="#5A6B7B">per-alert reasons, not just a score</text>
<rect x="814" y="412" width="350" height="64" rx="8" fill="#EAF6FD" stroke="#B9DFF3" stroke-width="1.6"/>
<text x="989.0" y="441.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2733">MODEL MONITOR</text>
<text x="989.0" y="459.0" text-anchor="middle" font-size="11" fill="#5A6B7B">drift detection on live scores</text>
<line x1="239.0" y1="372" x2="239.0" y2="412" stroke="#8FA3B4" stroke-width="1.8" marker-end="url(#arw)"/>
