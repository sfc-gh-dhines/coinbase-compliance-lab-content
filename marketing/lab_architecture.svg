<text x="860" y="173" text-anchor="middle" font-size="11" fill="#5A6B7B">scenario, channel, audience</text>

<rect x="980" y="120" width="180" height="66" rx="8" fill="#F2F7FB" stroke="#D3E2EE" stroke-width="1.6"/>
