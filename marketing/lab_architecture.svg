<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8FA3B4"/></marker></defs>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="40" y="42" font-size="24" font-weight="700" fill="#0052FF">Marketing Intelligence Lab: what we build in 90 minutes</text>
<text x="40" y="66" font-size="13" fill="#5A6B7B">Synthetic social data, sentiment enrichment, semantic view, search, agent, and dashboard — all inside Snowflake.</text>

