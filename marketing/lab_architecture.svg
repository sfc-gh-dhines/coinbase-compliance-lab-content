<text x="630" y="173" text-anchor="middle" font-size="11" fill="#5A6B7B">6 channels, 5 themes</text>

<rect x="760" y="120" width="200" height="66" rx="8" fill="#F2F7FB" stroke="#D3E2EE" stroke-width="1.6"/>
